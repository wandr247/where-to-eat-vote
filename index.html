<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Where should we eat?</title>
<style>
body{font-family:system-ui,sans-serif;background:#faf7f2;margin:0;color:#222}
main{max-width:640px;margin:0 auto;padding:20px}
h1{margin:.2em 0}.sub{color:#666;margin-bottom:16px}
.card{background:#fff;border-radius:12px;padding:14px;margin:10px 0;box-shadow:0 1px 4px #0001;position:relative;overflow:hidden}
.bar{position:absolute;left:0;top:0;bottom:0;background:#ffe3c2;z-index:0;transition:width .3s}
.row{position:relative;z-index:1;display:flex;align-items:center;gap:10px}
.info{flex:1}.name{font-weight:600;font-size:1.1em}.note{color:#666;font-size:.9em}
.count{font-size:1.6em;font-weight:700;min-width:2ch;text-align:center}
button{border:0;border-radius:8px;padding:8px 12px;font-size:1em;cursor:pointer;background:#eee}
button.vote{background:#e8590c;color:#fff}button.vote.mine{background:#2b8a3e}
.small{font-size:.8em;padding:4px 8px}
form{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}input{padding:8px;border:1px solid #ccc;border-radius:8px;font-size:1em}
.lead{background:#fff3bf;padding:8px 12px;border-radius:8px;margin:10px 0}
</style></head><body><main>
<h1>🍽️ Where should we eat?</h1><div class="sub">Tap Vote on your pick. Tap again to undo, or choose another to switch. Counts update live.</div>
<div id="lead"></div><div id="list"></div>
<form id="add"><input id="n" placeholder="Restaurant name" required><input id="d" placeholder="Note (optional)"><button class="vote">Add restaurant</button></form>
<p><button class="small" id="reset">Reset all votes</button></p>
</main><script>
let voter=localStorage.voter||(localStorage.voter=Math.random().toString(36).slice(2)+Date.now().toString(36));
let data=[],mine=null;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=(m,u,b)=>fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined}).then(r=>r.json());
function render(){
  const max=Math.max(1,...data.map(r=>r.votes)),top=Math.max(...data.map(r=>r.votes),0);
  const leaders=data.filter(r=>r.votes===top&&top>0);
  document.getElementById('lead').innerHTML=leaders.length?`<div class="lead">🏆 Leading: <b>${leaders.map(r=>esc(r.name)).join(', ')}</b> (${top} vote${top>1?'s':''})</div>`:'';
  document.getElementById('list').innerHTML=data.map(r=>`<div class="card"><div class="bar" style="width:${r.votes/max*100}%"></div><div class="row">
  <div class="info"><div class="name">${esc(r.name)}</div><div class="note">${esc(r.note||'')}</div>
  <div><button class="small" onclick="edit(${r.id})">Edit</button> <button class="small" onclick="del(${r.id})">Delete</button></div></div>
  <div class="count">${r.votes}</div><button class="vote ${mine===r.id?'mine':''}" onclick="vote(${r.id})">${mine===r.id?'✓ Voted':'Vote'}</button></div></div>`).join('');
}
async function vote(id){const r=await api('POST','/api/vote',{id,voter});data=r.restaurants;mine=r.mine;render()}
async function edit(id){const r=data.find(x=>x.id===id);const n=prompt('Name',r.name);if(n===null)return;const d=prompt('Note',r.note||'');await api('PUT','/api/restaurants/'+id,{name:n,note:d===null?r.note:d})}
async function del(id){if(confirm('Delete this restaurant?'))await api('DELETE','/api/restaurants/'+id)}
document.getElementById('add').onsubmit=async e=>{e.preventDefault();await api('POST','/api/restaurants',{name:n.value,note:d.value});n.value=d.value=''};
document.getElementById('reset').onclick=()=>{if(confirm('Reset all votes?'))api('POST','/api/reset')};
fetch('/api/mine?voter='+voter).then(r=>r.json()).then(r=>{mine=r.mine;render()});
const es=new EventSource('/api/events');es.onmessage=e=>{data=JSON.parse(e.data).restaurants;if(mine&&!data.find(r=>r.id===mine))mine=null;render()};
</script></body></html>
